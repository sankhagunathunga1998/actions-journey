name: sankha
on:
  push:
jobs:
  build:
   runs-on: ubuntu-latest
   steps:
      - name: Compute version
        id: ver
        run: echo "version=1.4.2" >> "$GITHUB_OUTPUT"
   outputs:
      version: ${{ steps.ver.outputs.version }}
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run tests
        run: echo "tests passed"
  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - run: echo "Deploying ${{ needs.build.outputs.version }}"
